name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable package version to verify (for example 0.1.0)
        required: true
        type: string
      publish:
        description: Publish publicly to npm (leave unchecked for verification only)
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Waits for a maintainer's approval and only runs from main.
    environment: npm
    permissions:
      contents: read # check out the source
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in the publishing job, so a poisoned cache can't reach the package.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install npm with trusted publishing support
        # An exact npm version; trusted publishing needs 11.5.1 or later.
        run: npm install --global npm@11.5.1 # zizmor: ignore[adhoc-packages]
      - name: Validate requested package and version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.name, '@usualui/lint');
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(pkg.version, process.env.RELEASE_VERSION);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          assert.equal(lock.name, pkg.name);
          assert.equal(lock.packages[''].name, pkg.name);
          assert.equal(pkg.publishConfig.access, 'public');
          assert.equal(pkg.publishConfig.registry, 'https://registry.npmjs.org/');
          JS
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:package
      - run: npm run audit:site
      - name: Select the verified archive
        id: archive
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const proof = JSON.parse(readFileSync('.usual-ui/artifacts/package-smoke.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `path=${proof.artifact}\n`);
          JS
      - name: Check npm publication contents without publishing
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: npm publish "$ARCHIVE" --dry-run --ignore-scripts --access public --registry https://registry.npmjs.org/
      - name: Retain the verified archive and proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-candidate-${{ inputs.version }}-${{ github.sha }}
          path: .usual-ui/artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Publish the verified archive with provenance
        if: inputs.publish
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
        run: npm publish "$ARCHIVE" --ignore-scripts --access public --provenance --registry https://registry.npmjs.org/
