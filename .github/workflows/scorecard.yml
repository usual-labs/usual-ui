name: Scorecard

# OpenSSF Scorecard rates the repository's security practices (branch protection, pinned actions,
# token permissions, signed releases and more), reports findings in code scanning, and publishes
# the score shown by the README badge.

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  branch_protection_rule:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      actions: read # read workflow runs for the checks
      security-events: write # report findings in code scanning
      id-token: write # publish the results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
